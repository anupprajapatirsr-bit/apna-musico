[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/jamendo"
  to = "/.netlify/functions/jamendo"
  status = 200
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
